<!doctype html>
<html
  lang="es"
  data-glosh-dag-ads-initial-ready="true"
  data-glosh-dag-video-lab-fixture="true"
>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>DAG Video Lab</title>
    <link rel="stylesheet" href="barrier.css">
    <style>
      html, body {
        min-height: 100%;
        margin: 0;
        background: #f4f6f8;
        color: #10243e;
        font-family: sans-serif;
      }
      main {
        min-height: 120vh;
        padding: 24px 16px 240px;
      }
      video {
        display: block;
        width: min(88vw, 480px);
        aspect-ratio: 4 / 3;
        margin: 180px auto 0;
        background: #000;
      }
      html[data-glosh-dag-video-lab-fixture="true"]
        video[data-glosh-dag-video-lab-token] {
        visibility: visible !important;
      }
      canvas {
        position: fixed;
        left: -10000px;
        top: -10000px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Fixture local DAG Video 01A0</h1>
      <p>El video debe permanecer detrás de la cobertura nativa.</p>
      <video id="fixture-video" muted playsinline></video>
      <canvas id="fixture-source" width="640" height="480"></canvas>
    </main>
    <script src="video-lab.js"></script>
    <script src="barrier.js"></script>
    <script src="video-lab-fixture.js"></script>
  </body>
</html>
