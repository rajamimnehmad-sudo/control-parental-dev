name: Preparar navegador protegido DEV

on:
  pull_request:
    paths:
      - ".github/workflows/build-protected-browser-dev.yml"
      - "app-dag-browser/**"
      - "scripts/dag_gradle.sh"
  workflow_dispatch:
    inputs:
      confirm_build:
        description: "Confirmo que quiero preparar el navegador protegido DEV"
        required: true
        default: false
        type: boolean

concurrency:
  group: protected-browser-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name == 'pull_request' }}
    name: Verificar navegador protegido
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas y compilación
        run: >-
          scripts/dag_gradle.sh
          testDagProtectionJs
          testDevDebugUnitTest
          testDiagnosticDebugUnitTest
          ktlintCheck
          lintDevDebug
          lintDiagnosticDebug
          assembleDevDebug
          --no-daemon

  build-signed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_build }}
    name: Preparar APK DEV firmada
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Preparar firma DEV estable
        shell: bash
        env:
          ANDROID_DEV_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEV_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_DEV_KEYSTORE_BASE64:-}" ]]; then
            echo "Falta secret ANDROID_DEV_KEYSTORE_BASE64" >&2
            exit 1
          fi
          printf '%s' "$ANDROID_DEV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dev-update.jks"
          chmod 600 "$RUNNER_TEMP/dev-update.jks"

      - name: Compilar, probar y verificar firma
        shell: bash
        env:
          ANDROID_DEV_KEYSTORE_PATH: ${{ runner.temp }}/dev-update.jks
          ANDROID_DEV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_DEV_KEYSTORE_PASSWORD }}
          ANDROID_DEV_KEY_ALIAS: ${{ secrets.ANDROID_DEV_KEY_ALIAS }}
          ANDROID_DEV_KEY_PASSWORD: ${{ secrets.ANDROID_DEV_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          scripts/dag_gradle.sh \
            testDagProtectionJs \
            testDevDebugUnitTest \
            testDiagnosticDebugUnitTest \
            ktlintCheck \
            lintDevDebug \
            lintDiagnosticDebug \
            assembleDevDebug \
            --no-daemon
          APK="app-dag-browser/build/outputs/apk/dev/debug/DagBrowser-dev-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK" > "$APK.sha256"

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: navegador-protegido-dev-v3
          path: |
            app-dag-browser/build/outputs/apk/dev/debug/DagBrowser-dev-debug.apk
            app-dag-browser/build/outputs/apk/dev/debug/DagBrowser-dev-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
