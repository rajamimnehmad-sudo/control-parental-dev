name: Temporary DAG v2 Policy Reviewer APK

on:
  pull_request:
    paths:
      - .github/workflows/dag-v2-policy-reviewer-apk-temp.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reviewer-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify locked review plan
        run: |
          set -euo pipefail
          python tools/dag-v2-benchmark/dag_v2_benchmark.py verify-evidence
          python tools/dag-v2-benchmark/dag_v2_policy_eval.py verify-review-plan

      - name: Reconstruct locked corpus
        id: corpus
        continue-on-error: true
        env:
          DAG_V2_BENCHMARK_CACHE: ${{ runner.temp }}/dag-v2-benchmark-cache
        run: |
          set -o pipefail
          python tools/dag-v2-benchmark/dag_v2_benchmark.py \
            --cache "$DAG_V2_BENCHMARK_CACHE" fetch-locked-corpus \
            2>&1 | tee "$RUNNER_TEMP/corpus-fetch.log"

      - name: Upload corpus diagnostics on failure
        if: steps.corpus.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dag-v2-policy-reviewer-corpus-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/corpus-fetch.log
          if-no-files-found: error
          retention-days: 1

      - name: Stop after corpus failure
        if: steps.corpus.outcome == 'failure'
        run: exit 1

      - name: Build reviewer APK
        if: steps.corpus.outcome == 'success'
        env:
          DAG_V2_BENCHMARK_CACHE: ${{ runner.temp }}/dag-v2-benchmark-cache
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew -p tools/dag-v2-benchmark/policy-reviewer \
            :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

      - name: Stage and verify APK
        if: steps.corpus.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reviewer-artifact"
          src="tools/dag-v2-benchmark/policy-reviewer/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$src"
          cp "$src" "$RUNNER_TEMP/reviewer-artifact/dag-v2-policy-reviewer-04b.apk"
          cd "$RUNNER_TEMP/reviewer-artifact"
          sha256sum dag-v2-policy-reviewer-04b.apk > SHA256SUMS.txt
          stat -c '%n %s bytes' dag-v2-policy-reviewer-04b.apk > FILE_INFO.txt
          printf '%s\n' \
            'package=com.contentfilter.dag2.policyreviewer.dev' \
            'versionName=04b-local' \
            'expectedSamples=203' \
            'internetPermission=false' \
            'webView=false' \
            > BUILD_INFO.txt

      - name: Upload private APK artifact
        if: steps.corpus.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dag-v2-policy-reviewer-04b-${{ github.sha }}
          path: ${{ runner.temp }}/reviewer-artifact/*
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
