name: Build Glosh Control Center APK

on:
  push:
    branches:
      - build/glosh-control-center-v2
    paths:
      - "app-control-center/**"
      - "docs/AI_TASK_TRACKER.json"
      - "settings.gradle.kts"
      - ".github/workflows/build-control-center.yml"

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state='pending' \
            -f context='Glosh Control Center APK' \
            -f description='Building APK' \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew :app-control-center:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: glosh-control-center-apk
          path: app-control-center/build/outputs/apk/debug/app-control-center-debug.apk
          if-no-files-found: error

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state="$JOB_STATUS"
          if [[ "$state" == "cancelled" ]]; then state="error"; fi
          description='APK build completed'
          if [[ "$state" != "success" ]]; then description='APK build failed'; fi
          gh api \
            --method POST \
            repos/${{ github.repository }}/statuses/${{ github.sha }} \
            -f state="$state" \
            -f context='Glosh Control Center APK' \
            -f description="$description" \
            -f target_url='${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
