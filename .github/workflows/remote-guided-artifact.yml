name: Remote Guided Assistant APK

on:
  push:
    branches:
      - work/remote-install-guided-assistant-08-chatgpt
    paths:
      - "tools/glosh-remote-spike/**"
      - ".github/workflows/remote-guided-artifact.yml"

permissions:
  contents: read

jobs:
  build-remote-guided:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrappers and gate executable
        run: |
          chmod +x ./gradlew
          chmod +x tools/glosh-remote-spike/verify_guided_assistant.sh

      - name: Run full Guided Assistant gate
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
        run: bash tools/glosh-remote-spike/verify_guided_assistant.sh

      - name: Preserve exact APK and report
        uses: actions/upload-artifact@v4
        with:
          name: GloshRemote-Guided-Professional-${{ github.sha }}
          path: |
            tools/glosh-remote-spike/app/build/outputs/apk/debug/GloshRemote-Guided-DEV.apk
            tools/glosh-remote-spike/app/build/outputs/apk/debug/REMOTE-INSTALL-GUIDED-ASSISTANT-08-report.txt
          if-no-files-found: error
          retention-days: 14
